<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

  <div *ngIf="loading" class="space-y-6">
    <div class="skeleton h-10 w-64"></div>
    <div class="skeleton h-64 w-full"></div>
    <div class="skeleton h-96 w-full"></div>
  </div>

  <ng-container *ngIf="!loading && site as station">

    <app-page-header [title]="station.nom"
                     [subtitle]="station.ip + (station.project ? ' · ' + station.project.nom : '')"
                     [backLink]="station.project ? ['/project', station.project._id, 'analysis'] : ['/projects']"
                     backLabel="Retour à l'analyse">
      <app-site-status [isAlive]="station.status" [lastSeenAt]="station.lastSeenAt"></app-site-status>
    </app-page-header>

    <div class="grid gap-6 lg:grid-cols-3">

      <!-- Live figures -->
      <section class="card p-6 lg:col-span-1">
        <h2 class="mb-4 text-lg font-semibold text-ink">Relevé actuel</h2>
        <div class="mb-5 rounded-xl bg-sunken px-4 py-3">
          <p class="text-xs font-semibold uppercase tracking-wide text-ink-muted">Tension batterie</p>
          <p class="mt-0.5 text-4xl font-bold tnum text-ink">
            {{ station.lastReading?.Battery_Voltage | measure
            }}<span class="ml-1 text-xl font-medium text-ink-muted">V</span>
          </p>
        </div>
        <app-site-data [reading]="station.lastReading"></app-site-data>
      </section>

      <!-- Forecast -->
      <section class="card p-6 lg:col-span-2">
        <h2 class="mb-4 text-lg font-semibold text-ink">Analyse prévisionnelle</h2>
        <app-site-analysis [analysis]="station.lastAnalysis" [reachable]="station.status"></app-site-analysis>
      </section>
    </div>

    <!-- Historical trend -->
    <section class="card mt-6 p-6">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-semibold text-ink">Historique de tension</h2>
          <p class="mt-0.5 text-sm text-ink-muted">
            Relevés enregistrés par le collecteur.
          </p>
        </div>

        <div class="flex gap-1.5" role="group" aria-label="Période affichée">
          <button *ngFor="let window of windows" type="button" (click)="selectWindow(window.hours)"
                  class="rounded-full px-3 py-1 text-xs font-semibold transition"
                  [ngClass]="selectedHours === window.hours
                    ? 'bg-brand text-ink-inverse'
                    : 'border border-line text-ink-secondary hover:bg-hover'">
            {{ window.label }}
          </button>
        </div>
      </div>

      <div class="relative h-96" [class.hidden]="!history.length">
        <canvas #historyCanvas></canvas>
      </div>

      <p *ngIf="!history.length" class="py-20 text-center text-sm text-ink-muted">
        Aucune mesure enregistrée sur cette période.
      </p>
    </section>

    <!-- Weather -->
    <section class="card mt-6 p-6">
      <app-meteo [lat]="station.latitude" [lon]="station.longitude"></app-meteo>
    </section>
  </ng-container>
</div>
