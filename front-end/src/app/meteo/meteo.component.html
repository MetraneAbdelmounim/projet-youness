<section>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-lg font-semibold text-ink">Prévisions météo</h2>
      <p class="mt-0.5 text-sm text-ink-muted">
        Conditions horaires influençant la recharge solaire.
      </p>
    </div>

    <div class="flex flex-wrap gap-1.5" role="group" aria-label="Choisir le jour">
      <button *ngFor="let day of days; let i = index" type="button"
              (click)="updateChartForDay(i)"
              class="rounded-full px-3 py-1 text-xs font-semibold transition"
              [ngClass]="selectedDayIndex === i
                ? 'bg-brand text-ink-inverse'
                : 'border border-line text-ink-secondary hover:bg-hover'">
        {{ day === 1 ? "Aujourd'hui" : 'J+' + (day - 1) }}
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="space-y-4">
    <div *ngFor="let placeholder of [1, 2, 3]" class="skeleton h-40 w-full"></div>
  </div>

  <p *ngIf="failed" class="rounded-xl bg-sunken px-4 py-8 text-center text-sm text-ink-muted">
    Prévisions météo momentanément indisponibles.
  </p>

  <!-- Small multiples: one measure per panel, each with its own scale. A single
       plot with three y-axes made the crossings between them meaningless. -->
  <div [class.hidden]="loading || failed" class="space-y-5">
    <div *ngFor="let panel of panels" class="rounded-xl border border-line p-4">
      <h3 class="mb-2 text-sm font-semibold text-ink">
        {{ panel.title }} <span class="font-normal text-ink-muted">({{ panel.unit }})</span>
      </h3>
      <div class="relative h-40">
        <canvas #panelCanvas></canvas>
      </div>
    </div>
  </div>
</section>
