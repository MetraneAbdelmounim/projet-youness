<div class="mx-auto max-w-xl px-4 py-8 sm:px-6">

  <app-page-header [title]="'password.pageTitle' | t"
                   [subtitle]="'password.pageSubtitle' | t"
                   [backLink]="['/projects']" [backLabel]="'common.backToProjects' | t">
  </app-page-header>

  <div class="card p-6">
    <form (ngSubmit)="onChangePassword(f)" #f="ngForm" class="space-y-5">

      <div>
        <label for="currentPass" class="label">{{ 'password.current' | t }}</label>
        <input id="currentPass" name="currentPass" type="password" ngModel required
               autocomplete="current-password" class="field" />
      </div>

      <hr class="border-line" />

      <div>
        <label for="newPass" class="label">{{ 'password.new' | t }}</label>
        <input id="newPass" name="newPass" type="password" ngModel required minlength="12"
               autocomplete="new-password" class="field" #newPass="ngModel" />
        <p class="mt-1.5 text-xs" [class.text-crit]="newPass.invalid && newPass.touched"
           [class.text-ink-muted]="!(newPass.invalid && newPass.touched)">
          {{ 'password.minChars' | t }}
        </p>
      </div>

      <div>
        <label for="confirmedPass" class="label">{{ 'password.confirmNew' | t }}</label>
        <input id="confirmedPass" name="confirmedPass" type="password" ngModel required
               autocomplete="new-password" class="field" #confirmedPass="ngModel" />
        <p *ngIf="confirmedPass.value && confirmedPass.value !== newPass.value"
           class="mt-1.5 text-xs text-crit">
          {{ 'password.mismatch' | t }}
        </p>
      </div>

      <div class="rounded-xl bg-sunken px-4 py-3 text-xs text-ink-secondary">
        {{ 'password.willLogout' | t }}
      </div>

      <button type="submit" class="btn btn-primary w-full"
              [disabled]="f.invalid || confirmedPass.value !== newPass.value">
        {{ 'password.submit' | t }}
      </button>
    </form>
  </div>
</div>
