<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

  <app-page-header [title]="'projects.pageTitle' | t"
                   [subtitle]="'projects.pageSubtitle' | t">
  </app-page-header>

  <!-- Skeletons mirror the real card geometry, so the layout does not jump. -->
  <div *ngIf="spinnerSite" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let placeholder of [1, 2, 3]" class="card p-6">
      <div class="skeleton h-11 w-11"></div>
      <div class="skeleton mt-5 h-5 w-2/3"></div>
      <div class="skeleton mt-3 h-4 w-1/3"></div>
    </div>
  </div>

  <ng-container *ngIf="!spinnerSite">
    <div *ngIf="projects.length; else noProjects"
         class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

      <button *ngFor="let project of projects; trackBy: trackById"
              type="button" (click)="dahsbord(project._id)"
              class="card card-interactive group p-6 text-left">

        <div class="flex items-start justify-between gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand-soft text-xl"
               aria-hidden="true">🏗️</div>
          <svg class="h-5 w-5 text-ink-muted transition group-hover:translate-x-0.5 group-hover:text-brand-ink"
               fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>

        <h2 class="mt-5 text-lg font-semibold text-ink">{{ project.nom }}</h2>
        <p class="mt-1 flex items-center gap-1.5 text-sm text-ink-muted">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
          </svg>
          {{ project.ville }}
        </p>
      </button>
    </div>

    <ng-template #noProjects>
      <app-empty-state icon="🗂️" [title]="'projects.empty' | t"
                       [description]="'projects.emptyDesc' | t">
      </app-empty-state>
    </ng-template>
  </ng-container>
</div>
