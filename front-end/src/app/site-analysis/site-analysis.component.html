<dl class="grid grid-cols-2 gap-x-4 gap-y-3">
  <div *ngFor="let metric of metrics" class="min-w-0">
    <dt class="flex items-center gap-1.5 text-xs text-ink-muted">
      <span aria-hidden="true">{{ metric.icon }}</span>
      <span class="truncate">{{ metric.label }}</span>
    </dt>
    <dd class="mt-0.5 text-sm font-semibold tnum text-ink">
      {{ metric.value | measure: metric.unit }}
    </dd>
  </div>
</dl>

<div class="mt-4 flex items-center justify-between gap-3 border-t border-line pt-4">
  <span class="text-xs font-semibold uppercase tracking-wide text-ink-muted">Performance prévue</span>
  <app-status-chip [label]="performanceLabel" [tone]="performanceTone"></app-status-chip>
</div>

<p *ngIf="analysis?.computedAt" class="mt-2 text-xs text-ink-muted">
  Calculé {{ analysis!.computedAt | date: 'short' }}
</p>
