<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

  <app-page-header title="Panneaux de parcours" [subtitle]="subtitle"
                   [backLink]="['/projects']" backLabel="Tous les projets">
  </app-page-header>

  <div *ngIf="spinnerSite" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let placeholder of [1, 2, 3]" class="card p-6">
      <div class="skeleton h-5 w-2/3"></div>
      <div class="skeleton mt-3 h-4 w-1/2"></div>
    </div>
  </div>

  <ng-container *ngIf="!spinnerSite">
    <div *ngIf="panneaus.length; else noPanneaux"
         class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

      <article *ngFor="let panneau of panneaus; trackBy: trackById" class="card card-interactive p-6">
        <header class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="truncate text-lg font-semibold text-ink" [title]="panneau.nom">{{ panneau.nom }}</h2>
            <p class="mt-0.5 font-mono text-xs text-ink-muted">{{ panneau.ip }}</p>
          </div>
          <app-site-status [isAlive]="panneau.status" [lastSeenAt]="panneau.lastSeenAt"></app-site-status>
        </header>

        <p class="mt-4">
          <span *ngIf="panneau.project?.nom" class="chip chip-brand">{{ panneau.project?.nom }}</span>
          <span *ngIf="!panneau.project?.nom" class="text-xs italic text-ink-muted">Pas de projet</span>
        </p>

        <a [href]="'http://' + panneau.ip + '/'" target="_blank" rel="noopener"
           class="btn btn-ghost mt-5 w-full">
          🪧 Ouvrir la console
        </a>
      </article>
    </div>

    <ng-template #noPanneaux>
      <app-empty-state icon="🪧" title="Aucun panneau"
                       description="Aucun panneau de parcours n'est rattaché à ce projet.">
      </app-empty-state>
    </ng-template>
  </ng-container>
</div>
