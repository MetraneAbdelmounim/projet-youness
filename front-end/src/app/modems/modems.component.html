<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

  <app-page-header [title]="'adminDevice.modemsTitle' | t" [subtitle]="subtitle"
                   [backLink]="['/projects']" [backLabel]="'common.allProjects' | t">
  </app-page-header>

  <div *ngIf="spinnerSite" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let placeholder of [1, 2, 3]" class="card p-6">
      <div class="skeleton h-5 w-2/3"></div>
      <div class="skeleton mt-3 h-4 w-1/2"></div>
    </div>
  </div>

  <ng-container *ngIf="!spinnerSite">
    <div *ngIf="modems.length; else noModems"
         class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

      <article *ngFor="let modem of modems; trackBy: trackById" class="card card-interactive p-6">
        <header class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="truncate text-lg font-semibold text-ink" [title]="modem.nom">{{ modem.nom }}</h2>
            <p class="mt-0.5 font-mono text-xs text-ink-muted">{{ modem.ip }}</p>
          </div>
          <app-site-status [isAlive]="modem.status" [lastSeenAt]="modem.lastSeenAt"></app-site-status>
        </header>

        <p class="mt-4">
          <span *ngIf="modem.project?.nom" class="chip chip-brand">{{ modem.project?.nom }}</span>
          <span *ngIf="!modem.project?.nom" class="text-xs italic text-ink-muted">{{ 'device.noProject' | t }}</span>
        </p>

        <a [href]="'http://' + modem.ip + '/'" target="_blank" rel="noopener"
           class="btn btn-ghost mt-5 w-full">
          📡 {{ 'device.openConsole' | t }}
        </a>
      </article>
    </div>

    <ng-template #noModems>
      <app-empty-state icon="📡" [title]="'device.noModem' | t"
                       [description]="'device.noModemHint' | t">
      </app-empty-state>
    </ng-template>
  </ng-container>
</div>
