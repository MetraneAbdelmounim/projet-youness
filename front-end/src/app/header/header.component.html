<header *ngIf="memberIsAuthenticated"
        class="sticky top-0 z-40 border-b border-line bg-surface/85 backdrop-blur-xl">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">

    <!-- Brand -->
    <button type="button" (click)="home()" class="flex items-center gap-3">
      <img src="assets/images/logo.png" alt="" class="h-8 w-auto dark:brightness-0 dark:invert" />
      <span class="hidden text-sm font-semibold tracking-tight text-ink sm:block">
        {{ 'nav.brand' | t }}
      </span>
    </button>

    <!-- Primary navigation -->
    <nav class="flex items-center gap-1">
      <a routerLink="/projects" routerLinkActive="bg-brand-soft text-brand-ink"
         class="rounded-lg px-3 py-1.5 text-sm font-medium text-ink-secondary transition hover:bg-hover hover:text-ink">
        {{ 'nav.projects' | t }}
      </a>
      <a *ngIf="isAdmin" routerLink="/dashbord/sites" routerLinkActive="bg-brand-soft text-brand-ink"
         class="rounded-lg px-3 py-1.5 text-sm font-medium text-ink-secondary transition hover:bg-hover hover:text-ink">
        {{ 'nav.administration' | t }}
      </a>
    </nav>

    <!-- Right cluster -->
    <div class="flex items-center gap-2">
      <app-language-toggle></app-language-toggle>
      <app-theme-toggle></app-theme-toggle>

      <!-- Account menu. Built natively rather than with Flowbite's data-attribute
           dropdown, which needed a re-init on every navigation to work at all. -->
      <div class="relative">
        <button type="button" (click)="menuOpen = !menuOpen"
                class="flex items-center gap-2 rounded-lg border border-line py-1 pl-1 pr-2 transition hover:bg-hover"
                [attr.aria-expanded]="menuOpen" aria-haspopup="menu">
          <span class="flex h-7 w-7 items-center justify-center rounded-md bg-brand text-xs font-bold text-ink-inverse">
            {{ initials }}
          </span>
          <span class="hidden text-sm font-medium text-ink sm:block">{{ username }}</span>
          <svg class="h-4 w-4 text-ink-muted transition" [class.rotate-180]="menuOpen"
               fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div *ngIf="menuOpen" role="menu"
             class="absolute right-0 mt-2 w-56 overflow-hidden rounded-xl border border-line bg-surface shadow-pop"
             style="box-shadow: var(--shadow-pop)">
          <div class="border-b border-line px-4 py-3">
            <p class="truncate text-sm font-semibold text-ink">{{ username }}</p>
            <p class="mt-0.5 text-xs text-ink-muted">{{ roleKey | t }}</p>
          </div>
          <div class="p-1.5">
            <a routerLink="/dashbord/change-password" role="menuitem" (click)="menuOpen = false"
               class="block rounded-lg px-3 py-2 text-sm text-ink-secondary transition hover:bg-hover hover:text-ink">
              {{ 'nav.changePassword' | t }}
            </a>
            <a *ngIf="isAdmin" routerLink="/dashbord/licence" role="menuitem" (click)="menuOpen = false"
               class="block rounded-lg px-3 py-2 text-sm text-ink-secondary transition hover:bg-hover hover:text-ink">
              {{ 'nav.licence' | t }}
            </a>
            <button type="button" role="menuitem" (click)="onLogout()"
                    class="block w-full rounded-lg px-3 py-2 text-left text-sm text-crit transition hover:bg-crit-soft">
              {{ 'nav.logout' | t }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
