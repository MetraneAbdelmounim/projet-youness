<div class="mx-auto max-w-7xl px-4 py-8 sm:px-6">

  <app-page-header title="Stations MPPT"
                   [subtitle]="subtitle"
                   [backLink]="['/projects']" backLabel="Tous les projets">
    <a *ngIf="projectId" [routerLink]="['/project', projectId, 'dashbord']" class="btn btn-ghost">
      Tableau de bord
    </a>
    <a *ngIf="projectId" [routerLink]="['/project', projectId, 'analysis']" class="btn btn-primary">
      Analyse
    </a>
      <span *ngIf="lastUpdated" class="chip chip-neutral" title="Actualisation automatique toutes les 30 s">
      <span class="chip-dot live-dot"></span>
      {{ lastUpdated | date: 'HH:mm:ss' }}
    </span>
</app-page-header>

  <div *ngIf="spinnerSite" class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">
    <div *ngFor="let placeholder of [1, 2, 3, 4, 5, 6]" class="card p-6">
      <div class="skeleton h-6 w-1/2"></div>
      <div class="skeleton mt-2 h-4 w-1/3"></div>
      <div class="skeleton mt-6 h-28 w-full"></div>
    </div>
  </div>

  <ng-container *ngIf="!spinnerSite">
    <div *ngIf="sites.length; else noSites"
         class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">

      <article *ngFor="let site of sites; trackBy: trackById" class="card card-interactive p-6">

        <header class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="truncate text-lg font-semibold text-ink" [title]="site.nom">{{ site.nom }}</h2>
            <p class="mt-0.5 font-mono text-xs text-ink-muted">{{ site.ip }}</p>
          </div>
          <app-site-status [isAlive]="site.status" [lastSeenAt]="site.lastSeenAt"></app-site-status>
        </header>

        <!-- Headline figure. One number reads better as a figure than as a plot. -->
        <div class="mt-5 flex items-end justify-between gap-4 rounded-xl bg-sunken px-4 py-3">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-ink-muted">Tension batterie</p>
            <p class="mt-0.5 text-3xl font-bold tnum text-ink">
              {{ site.lastReading?.Battery_Voltage | measure
              }}<span class="ml-1 text-lg font-medium text-ink-muted">V</span>
            </p>
          </div>
          <!-- Hidden while the station is down: the forecast describes a
               reading that no longer holds. -->
          <app-status-chip *ngIf="site.status && site.lastAnalysis?.performance"
                           [label]="performanceLabel(site)"
                           [tone]="performanceTone(site)"></app-status-chip>
        </div>

        <app-site-data class="mt-5 block" [reading]="site.lastReading"></app-site-data>

        <!-- Device consoles on the station's own network -->
        <footer class="mt-6 border-t border-line pt-4">
          <p class="label mb-2">Accès équipements</p>
          <div class="flex flex-wrap gap-1.5">
            <a *ngFor="let link of deviceLinks(site)" [href]="link.url" target="_blank" rel="noopener"
               class="chip chip-neutral transition hover:bg-brand-soft hover:text-brand-ink">
              {{ link.icon }} {{ link.label }}
            </a>
          </div>
        </footer>
      </article>
    </div>

    <ng-template #noSites>
      <app-empty-state icon="🔌" title="Aucune station"
                       description="Aucune station MPPT n'est rattachée à ce projet pour l'instant.">
      </app-empty-state>
    </ng-template>
  </ng-container>
</div>
