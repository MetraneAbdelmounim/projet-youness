<dl class="grid grid-cols-2 gap-x-4 gap-y-3">
  <div *ngFor="let metric of metrics" class="min-w-0">
    <dt class="flex items-center gap-1.5 text-xs text-ink-muted">
      <span aria-hidden="true">{{ metric.icon }}</span>
      <span class="truncate">{{ metric.label | t }}</span>
    </dt>
    <dd class="mt-0.5 text-sm font-semibold tnum text-ink">
      {{ metric.value | measure: metric.unit }}
    </dd>
  </div>
</dl>

<!-- Staleness is stated rather than implied by an old value shown as current. -->
<p *ngIf="reading?.measuredAt && reading?.reachable" class="mt-3 text-xs text-ink-muted">
  {{ 'reading.measuredAt' | t: { time: (reading!.measuredAt | date: 'short') || '' } }}
</p>
<p *ngIf="reading && !reading.reachable" class="mt-3 flex items-start gap-1.5 text-xs text-crit">
  <svg class="mt-px h-3.5 w-3.5 flex-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
  </svg>
  <span>{{ 'reading.readFailed' | t }}{{ reading.error ? ' — ' + reading.error : '' }}</span>
</p>
